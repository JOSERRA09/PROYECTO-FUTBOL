<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Proyecto Futbol</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ENCABEZADO PRINCIPAL -->
    <header>
        <h1>PROYECTO FUTBOL</h1>
        <p>
            ESTADISTICAS DEL FUTBOL EUROPEO
        </p>
    </header>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav>
        <a href="index.html">Inicio</a>
        <a href="ligas.html">Ligas</a>
        <a href="jugadores.html">Jugadores</a>
        <a href="estadisticas.html">Estadísticas</a>
        <a href="europa.html">Competiciones Europeas</a>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <section class="estadisticas">

            <h2>ESTADÍSTICAS DE JUGADORES</h2>

            <p>
                Consulta y compara las principales estadísticas
                de los jugadores del fútbol europeo.
            </p>

            <!-- FILTROS -->
            <div class="filtros-estadisticas">

                <div>
                    <label for="liga-estadisticas">
                        Liga:
                    </label>

                    <select id="liga-estadisticas">

                        <option value="todas">
                            Todas las ligas
                        </option>

                        <option value="premier">
                            Premier League
                        </option>

                        <option value="laliga">
                            LaLiga
                        </option>

                        <option value="seriea">
                            Serie A
                        </option>

                        <option value="bundesliga">
                            Bundesliga
                        </option>

                        <option value="ligue1">
                            Ligue 1
                        </option>

                    </select>
                </div>

                <div>
                    <label for="orden-estadisticas">
                        Ordenar por:
                    </label>

                    <select id="orden-estadisticas">

                        <option value="goles">
                            Goles
                        </option>

                        <option value="asistencias">
                            Asistencias
                        </option>

                        <option value="titulos">
                            Títulos
                        </option>

                    </select>
                </div>

            </div>

            <!-- TABLA DE ESTADÍSTICAS -->

            <div class="tabla-estadisticas">

                <table>

                    <thead>
                        <tr>
                            <th>Pos.</th>
                            <th>Jugador</th>
                            <th>Equipo</th>
                            <th>Liga</th>
                            <th>Goles</th>
                            <th>Asistencias</th>
                            <th>Títulos</th>
                        </tr>
                    </thead>

                    <tbody id="tabla-jugadores">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
